name: flutter_vm_mcp
description: >-
  MCP server that inspects a running Flutter app over the Dart VM Service to
  find the real on-screen geometry of widgets, so AI coding agents can click
  the right pixel instead of guessing from a screenshot.
version: 0.1.0
repository: https://github.com/alesterxf/flutter_vm_mcp
issue_tracker: https://github.com/alesterxf/flutter_vm_mcp/issues

environment:
  sdk: ^3.7.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  dart_mcp: ^0.5.2
  vm_service: ^15.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  test: ^1.25.0
